name: R check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-syntax:
    name: R syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Parse R scripts
        shell: Rscript {0}
        run: |
          required <- c("README.md", "DESCRIPTION", "config.yaml")
          if (!all(file.exists(required))) {
            stop("Arquivos obrigatorios ausentes: ",
                 paste(required[!file.exists(required)], collapse = ", "))
          }

          scripts <- c(
            "analise_nqo1_cardiotoxicidade.R",
            list.files("tutoriais", pattern = "[.]R$", full.names = TRUE)
          )
          scripts <- scripts[file.exists(scripts)]
          if (length(scripts) == 0) stop("Nenhum script R encontrado.")

          for (script in scripts) {
            parse(script)
            cat("OK:", script, "\n")
          }

          cat("R:", R.version.string, "\n")
